spring:
  application:
    name: rag-document-qa
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ragdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:20MB}
      max-request-size: ${MAX_REQUEST_SIZE:100MB}
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.2}
          temperature: 0.2
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: ${EMBEDDING_DIMENSIONS:768}
        distance-type: COSINE_DISTANCE
        index-type: HNSW
        schema-name: public
        table-name: vector_store
        remove-existing-vector-store-table: false

server:
  port: ${PORT:8080}

rag:
  chunk-size: ${RAG_CHUNK_SIZE:1000}
  chunk-overlap: ${RAG_CHUNK_OVERLAP:150}
  default-top-k: ${RAG_DEFAULT_TOP_K:5}
  max-top-k: ${RAG_MAX_TOP_K:20}
  similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.65}
  max-history-messages: ${RAG_MAX_HISTORY_MESSAGES:12}
  max-upload-bytes: ${RAG_MAX_UPLOAD_BYTES:20971520}
  max-uploads-per-request: ${RAG_MAX_UPLOADS_PER_REQUEST:5}
