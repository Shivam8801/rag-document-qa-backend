spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: ${SPRING_APPLICATION_NAME}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: ${JPA_OPEN_IN_VIEW}
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL}
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE}
      max-request-size: ${MAX_REQUEST_SIZE}
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL}
          temperature: ${OLLAMA_TEMPERATURE}
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL}
    vectorstore:
      pgvector:
        initialize-schema: ${PGVECTOR_INITIALIZE_SCHEMA}
        dimensions: ${EMBEDDING_DIMENSIONS}
        distance-type: ${PGVECTOR_DISTANCE_TYPE}
        index-type: ${PGVECTOR_INDEX_TYPE}
        schema-name: ${PGVECTOR_SCHEMA}
        table-name: ${PGVECTOR_TABLE}
        remove-existing-vector-store-table: ${PGVECTOR_REMOVE_EXISTING_TABLE}

server:
  port: ${PORT}

rag:
  chunk-size: ${RAG_CHUNK_SIZE}
  chunk-overlap: ${RAG_CHUNK_OVERLAP}
  default-top-k: ${RAG_DEFAULT_TOP_K}
  max-top-k: ${RAG_MAX_TOP_K}
  similarity-threshold: ${RAG_SIMILARITY_THRESHOLD}
  max-history-messages: ${RAG_MAX_HISTORY_MESSAGES}
  max-upload-bytes: ${RAG_MAX_UPLOAD_BYTES}
  max-uploads-per-request: ${RAG_MAX_UPLOADS_PER_REQUEST}
